[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdaa-ai"
version = "0.1.0"
description = "Provenance-aware knowledge asset discovery, assessment, amplification, and value-learning research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "James Li" }
]
maintainers = [
  { name = "OmicsAI Lab, Georgetown University" }
]
keywords = [
  "knowledge assets",
  "knowledge management",
  "information systems",
  "generative AI",
  "design science",
  "provenance",
  "research software"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "networkx>=3.2,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
app = [
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2"
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1"
]
all = [
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1"
]

[project.scripts]
kdaa = "kdaa.cli:app"

[project.urls]
Homepage = "https://github.com/omicsai-lab/kdaa-ai"
Repository = "https://github.com/omicsai-lab/kdaa-ai"
Issues = "https://github.com/omicsai-lab/kdaa-ai/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kdaa.resources" = ["*.yaml", "*.j2"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["kdaa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP038"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
