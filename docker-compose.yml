services:
  app:
    build: .
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    build: .
    command: uvicorn kdaa.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
